name: Fork-only i18n split verification

on:
  push:
    branches: ['verify/i18n-split-20260929']
    paths:
      - '.github/workflows/i18n-split-verification.yml'
      - '.github/i18n-split.py'
      - '.github/i18n-split-check.py'

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'nikdav/pipeshub-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and preserve exact candidate commits in fork only
        id: split
        env:
          SPLIT_OUTPUT: ${{ runner.temp }}/i18n-split-output
        run: python .github/i18n-split.py
      - name: Preserve split manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-split-manifest
          path: ${{ runner.temp }}/i18n-split-output/split-manifest.json
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: prepare
    if: github.repository == 'nikdav/pipeshub-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: Verify ${{ matrix.name }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      SPLIT_NAME: ${{ matrix.name }}
      SPLIT_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact product tree without verification tooling
        run: |
          cp .github/i18n-split-check.py "$RUNNER_TEMP/i18n-split-check.py"
          git checkout --detach "$SPLIT_SHA"
          test "$(git rev-parse HEAD)" = "$SPLIT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Execute all checks and record actual results
        run: python "$RUNNER_TEMP/i18n-split-check.py"
      - name: Preserve complete verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-split-check-${{ matrix.name }}
          path: ${{ runner.temp }}/split-check-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
