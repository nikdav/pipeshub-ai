name: Validate German locale rebase candidate
on:
  push:
    branches:
      - chore/german-locale-rebase-20260921
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb2221d754c4b2dec3e70aaa3cd381f03f51052c
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          node frontend/scripts/check-i18n-parity.mjs
          node --test frontend/scripts/check-i18n-parity.test.mjs
          git diff --check d53f12b735d1feb995d4ed7e05a9b4e29ae93cb2...HEAD
          test "$(git rev-list --count d53f12b735d1feb995d4ed7e05a9b4e29ae93cb2..HEAD)" = "3"
          grep -Fxq "'use client';" frontend/app/components/share/index.ts
          grep -Fxq "'use client';" frontend/app/components/share/types.ts
          grep -Fq "}, [onUploadFile, t]);" 'frontend/app/(main)/chat/components/chat-input.tsx'
