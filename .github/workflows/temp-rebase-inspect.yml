name: Inspect German locale rebase
on:
  push:
    branches:
      - chore/german-locale-rebase-20260921
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d73fe0c9fcadb88882d7fd2084c01b35ef64c174
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect rebase without publishing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Niklas"
          git config user.email "55577205+nikdav@users.noreply.github.com"
          git fetch https://github.com/pipeshub-ai/pipeshub-ai.git 554f5de5f68798c10f58e7815356686ded6005b2
          git switch -c candidate
          if git rebase --onto 554f5de5f68798c10f58e7815356686ded6005b2 f291a30c822a6826d62df67f6a3719900dbccc91; then
            echo REBASE_CLEAN
          else
            echo REBASE_CONFLICTS
            git diff --name-only --diff-filter=U
            git diff --cc
          fi
      - name: Inspect upstream locale delta
        shell: python
        run: |
          import json, subprocess
          def read(ref, path):
              return json.loads(subprocess.check_output(['git','show',f'{ref}:{path}'], text=True))
          def flat(obj, prefix=''):
              if isinstance(obj, dict):
                  out={}
                  for k,v in obj.items():
                      out.update(flat(v, f'{prefix}.{k}' if prefix else k))
                  return out
              return {prefix:obj}
          base='f291a30c822a6826d62df67f6a3719900dbccc91'
          up='554f5de5f68798c10f58e7815356686ded6005b2'
          feature='70ba69f28bf4080e72456256642457917c2e2833'
          for locale in ['en-US','de-DE']:
              path=f'frontend/lib/i18n/locales/{locale}.json'
              b,u,fe=flat(read(base,path)),flat(read(up,path)),flat(read(feature,path))
              up_changed={k for k in set(b)|set(u) if b.get(k,'__MISSING__')!=u.get(k,'__MISSING__')}
              fe_changed={k for k in set(b)|set(fe) if b.get(k,'__MISSING__')!=fe.get(k,'__MISSING__')}
              overlap=sorted(up_changed & fe_changed)
              print(locale, 'OVERLAP_COUNT', len(overlap))
              for k in overlap:
                  print(locale, 'OVERLAP', k, json.dumps({'base':b.get(k,'__MISSING__'),'feature':fe.get(k,'__MISSING__'),'upstream':u.get(k,'__MISSING__')},ensure_ascii=False))
